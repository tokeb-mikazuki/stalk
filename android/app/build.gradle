plugins {
    id 'com.android.application'
}

// 게임 본체를 앱 안에 넣는다 — 저장소 루트에서 `npm run build` 로 먼저 만들어 둘 것
//   songshin 판: dist/index.html        → 공포의 송신계단
//   yugi 판:     dist/channel-yugi.html → 공포의 채널유기
def editions = [songshin: 'index.html', yugi: 'channel-yugi.html']
def copyTasks = editions.collect { flavor, file ->
    def src = rootProject.file("../dist/${file}")
    tasks.register("copyGame${flavor.capitalize()}", Copy) {
        from src
        into layout.buildDirectory.dir("generated/game/${flavor}")
        rename { 'index.html' }
        doFirst {
            if (!src.exists()) throw new GradleException("dist/${file} 이 없습니다. 저장소 루트에서 npm run build 를 먼저 실행하세요.")
        }
    }
}

android {
    namespace 'com.songshin.stairwell'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            // 같은 키로 서명해야 지우지 않고 덮어 설치(업데이트)할 수 있다
            storeFile file('songshin-release.jks')
            storePassword 'songshin'
            keyAlias 'songshin'
            keyPassword 'songshin'
        }
    }

    // 두 판을 따로 설치할 수 있게 패키지 이름이 다르다
    flavorDimensions 'edition'
    productFlavors {
        songshin {
            dimension 'edition'
            applicationId 'com.songshin.stairwell'
        }
        yugi {
            dimension 'edition'
            applicationId 'com.channelyugi.game'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        songshin.assets.srcDirs += layout.buildDirectory.dir('generated/game/songshin')
        yugi.assets.srcDirs += layout.buildDirectory.dir('generated/game/yugi')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild') { dependsOn copyTasks }
