plugins {
    id 'com.android.application'
}

// 게임 본체(dist/index.html)를 앱 안에 넣는다 — 빌드 전에 `npm run build` 로 만들어 둘 것
def gameHtml = rootProject.file('../dist/index.html')
def copyGame = tasks.register('copyGame', Copy) {
    from gameHtml
    into layout.buildDirectory.dir('generated/game/assets')
    doFirst {
        if (!gameHtml.exists()) throw new GradleException('dist/index.html 이 없습니다. 저장소 루트에서 npm run build 를 먼저 실행하세요.')
    }
}

android {
    namespace 'com.songshin.stairwell'
    compileSdk 35

    defaultConfig {
        applicationId 'com.songshin.stairwell'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            // 같은 키로 서명해야 지우지 않고 덮어 설치(업데이트)할 수 있다
            storeFile file('songshin-release.jks')
            storePassword 'songshin'
            keyAlias 'songshin'
            keyPassword 'songshin'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main.assets.srcDirs += layout.buildDirectory.dir('generated/game/assets')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild') { dependsOn copyGame }
